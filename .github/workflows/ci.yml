# CI gate for PRs into development and pushes to development/main.
# Every env value in this file is fake and CI-only; nothing here is a real credential.
name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, format, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Next inlines NEXT_PUBLIC_* at build time; a fake local URL keeps the
      # CI bundle shaped like a real build without pointing anywhere real
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # The repo declares no engines/.nvmrc, so CI pins Node 24 LTS
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run prettier

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
